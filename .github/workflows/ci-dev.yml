name: CI - dev

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Java + JS/TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS/TS lint dependencies
        working-directory: test-performance-Service
        run: yarn install --frozen-lockfile

      - name: Lint JS/TS (test-performance-Service)
        working-directory: test-performance-Service
        run: yarn eslint . --ext .js,.mjs,.cjs,.ts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Lint Java (Gradle Checkstyle - auth)
        working-directory: services/common/auth
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Lint Java (Gradle Checkstyle - gateway)
        working-directory: services/common/gateway
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Lint Java (Gradle Checkstyle - registry)
        working-directory: services/common/registry
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Lint Java (Gradle Checkstyle - user)
        working-directory: services/common/user
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Lint Java (Maven Checkstyle - test-performance-Service)
        working-directory: test-performance-Service
        run: mvn -B -ntp -DskipTests checkstyle:check
